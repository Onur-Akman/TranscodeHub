server.port=8080

# PostgreSQL Database (local development)
spring.datasource.url=jdbc:postgresql://localhost:5433/transcoder
spring.datasource.username=transcoder
spring.datasource.password=transcoder123
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File paths (local development)
app.videos.input-dir=./videos/input
app.videos.output-dir=./videos/output

# File upload
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# JWT
app.jwt.secret=MyVideoTranscoderSuperSecretKeyThatIsAtLeast256BitsLong2026
app.jwt.expiration-ms=86400000

# CMS (local development)
app.cms.poster-dir=./posters
app.cms.subtitle-dir=./videos/input/subtitles
app.cms.dub-dir=./videos/input/dub
