<div class="animate-in">
  <div class="page-header">
    <h1>Watch Party</h1>
    <p>Pick a movie to watch together with friends</p>
  </div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading movies...</p>
  </div>

  <div class="movies-grid" *ngIf="!loading && movies.length > 0">
    <div class="movie-card" *ngFor="let movie of movies; let i = index" [style.animation-delay]="(i * 0.05) + 's'">
      <div class="poster-wrap">
        <img [src]="getPoster(movie)" [alt]="movie.title" class="poster-img" loading="lazy" />
        <div class="format-badge">
          <span>{{ movie.outputFormat }}</span>
        </div>
        <div class="poster-overlay">
          <div class="overlay-btns">
            <button class="overlay-btn party-btn" (click)="createRoom(movie)" [disabled]="creatingRoom">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              {{ creatingRoom ? 'Creating...' : 'Create Room' }}
            </button>
          </div>
        </div>
      </div>
      <div class="movie-info">
        <h3 class="movie-title">{{ movie.title }}</h3>
        <div class="movie-meta">
          <span class="movie-year">{{ movie.year }}</span>
          <span class="movie-rating badge badge-warning" *ngIf="movie.imdbRating">{{ movie.imdbRating }}</span>
        </div>
        <div class="movie-genre" *ngIf="movie.genre">{{ movie.genre }}</div>
      </div>
    </div>
  </div>

  <div class="empty-card card" *ngIf="!loading && movies.length === 0">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
    <h3>No movies available</h3>
    <p>Upload and transcode movies from the CMS page first</p>
  </div>
</div>
