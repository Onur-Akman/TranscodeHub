services:
  postgres:
    image: postgres:16-alpine
    container_name: transcoder-postgres
    environment:
      POSTGRES_DB: transcoder
      POSTGRES_USER: transcoder
      POSTGRES_PASSWORD: transcoder123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcoder"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: transcoder-backend
    volumes:
      - ./videos/input:/app/videos/input
      - ./videos/output:/app/videos/output
      - ./posters:/app/posters
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: transcoder-nginx
    ports:
      - "80:80"
      - "1935:1935"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./videos/output:/usr/share/nginx/html/videos/output:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
